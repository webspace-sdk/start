<!DOCTYPE html>
<html>
<head>
<title>My Webspace</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<!-- This one line turns the page into a walkable, multiplayer 3D world. -->
<script src="https://webspaces.space/run/0.10.0-alpha.7/webspace.js"></script>

<!-- The world: terrain shape, palette, and where visitors arrive. Change the colors; they carry the mood. -->
<meta name="webspace.environment.type" content="terrain" />
<meta name="webspace.environment.terrain.type" content="hills" />
<meta name="webspace.environment.terrain.seed" content="21" />
<meta name="webspace.environment.terrain.colors.sky" content="#8fb3e8" />
<meta name="webspace.environment.terrain.colors.ground" content="#6f8f5a" />
<meta name="webspace.environment.terrain.colors.grass" content="#8fbf6a" />
<meta name="webspace.environment.terrain.colors.edge" content="#4d6340" />
<meta name="webspace.environment.terrain.colors.rock" content="#9a958c" />
<meta name="webspace.environment.terrain.colors.leaves" content="#e98f9a" />
<meta name="webspace.environment.terrain.colors.bark" content="#6b4b3a" />
<meta name="webspace.environment.terrain.colors.water" content="#4f8fb0" />
<meta name="webspace.environment.spawn_point.transform" content="translate3d(0cm, 0cm, 0cm)" />
<meta name="webspace.environment.spawn_point.radius" content="1" />
</head>
<body>
<!-- Every element in <body> is an object in the world, placed with a CSS transform (centimeters). -->
<label id="welcome" style="color: #1f2a44; background-color: #f7f3ea; font-family: serif; transform: translate3d(-160cm, 300cm, -380cm) rotate3d(0, 1, 0, 0.3rad) scale3d(1.3, 1.3, 1.3)"><h1>Hello, world.</h1><p>This place is one HTML file. Edit <code>index.html</code>, or change things right here (press <strong>/</strong> to add something) and they'll be saved back into the file.</p><p>Anyone who opens this page is here with you.</p></label>

<model id="apple" src="models/apple.svox" style="transform: translate3d(150cm, 270cm, -300cm) scale3d(1.5, 1.5, 1.5)"></model>

<script type="module">
  // Scripts drive the world by changing the document. Here, the apple bobs gently,
  // and clicking it makes it spin for everyone who's here.
  await webspace.ready;

  const apple = document.getElementById("apple");
  let spinUntil = 0;

  apple.addEventListener("click", () => webspace.state.set("spin", Date.now() + 2000));
  webspace.state.addEventListener("change", e => {
    if (e.detail.key === "spin") spinUntil = e.detail.value;
  });

  const float = () => {
    const t = Date.now() / 1000;
    const spin = Date.now() < spinUntil ? (spinUntil - Date.now()) / 300 : 0;
    apple.style.transform = `translate3d(150cm, ${(270 + Math.sin(t) * 10).toFixed(1)}cm, -300cm) rotateY(${spin.toFixed(3)}rad) scale3d(1.5, 1.5, 1.5)`;
    requestAnimationFrame(float);
  };
  float();
</script>
</body>
</html>
